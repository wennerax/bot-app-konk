<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Розыгрыши</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="hero"><p class="eyebrow">TELEGRAM GIVEAWAYS</p><h1>Твои шансы<br><em>на приз.</em></h1><p class="subhead">Открытые конкурсы от каналов, где ты уже подписан.</p></header>
    <section class="toolbar"><span id="user-label">Загрузка профиля</span><button id="refresh" aria-label="Обновить">↻</button></section>
    <section id="giveaways" class="list" aria-live="polite"></section>
    <section id="participation" class="participation" hidden>
      <div class="dice" aria-hidden="true">⚄</div>
      <p id="check-status">Проверяем условия конкурса</p>
      <button id="participate" class="primary">Участвовать</button>
      <button id="back" class="secondary">К списку</button>
    </section>
  </main>
  <template id="giveaway-template"><article class="giveaway"><div class="number"></div><div class="content"><h2></h2><p class="meta"></p><p class="description"></p><button class="join">Участвовать</button></div></article></template>
  <script src="/app.js"></script>
</body>
</html>
